<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rapidflare Select</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  /* paper / ink — the working surface */
  --paper:#FDFDFB;
  --ink:#14151E;
  --ink-2:#363B47;
  --graphite:#5B6270;
  --faint:#8991A0;
  --hairline:#DBDEE5;
  --hairline-2:#EBEDF1;
  --surface:#FFFFFF;
  --ground:#F5F6F8;
  /* trace — verified, sourced, measured data (PCB/oscilloscope teal) */
  --trace:#0C8B82;
  --trace-tint:#E1F3F1;
  /* structural dark surface (sidenav) */
  --navy:#181A29;
  --no:#B23B2E;
  --no-tint:#FBECEA;

  /* ---- v3 design-system tokens ---- */
  --background:#fbfbfd;
  --card:#ffffff;
  --muted:#f4f4f7;
  --border:#e4e4ea;
  --foreground:#191a23;
  --muted-foreground:#6b6d7a;

  --primary:#5b5fef;
  --primary-hover:#4a4ed9;
  --primary-subtle:#eef0fd;
  --primary-foreground:#ffffff;

  --attention:#b45309;
  --attention-subtle:#fdf1e5;

  --radius-sm:6px;
  --radius-md:10px;
  --radius-lg:14px;

  --duration-fast:120ms;
  --duration-base:180ms;
  --duration-slow:280ms;
  --ease-out:cubic-bezier(0.16,1,0.3,1);

  --shadow-sm:0 1px 2px rgba(15,15,20,.04),0 1px 1px rgba(15,15,20,.03);
  --shadow-md:0 4px 16px rgba(15,15,20,.08),0 2px 6px rgba(15,15,20,.04);

  --r:6px;
  --ease:cubic-bezier(.22,.72,.28,1);
}
*{box-sizing:border-box}
body{background:var(--background);color:var(--foreground);font-family:"Inter",ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
table{font-family:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* ---------- stage ---------- */
#stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:16px}
#scaler{width:1280px;height:720px;transform-origin:top center;flex:none}
#frame{width:1280px;height:720px;background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgba(21,24,50,.06),0 18px 48px -20px rgba(21,24,50,.28);display:flex;flex-direction:row;position:relative}

/* ---------- side nav ---------- */
.sidenav{width:250px;flex:none;background:var(--navy);color:#fff;display:flex;flex-direction:column;overflow:hidden}
.sidenav-scroll{flex:1;min-height:0;overflow-y:auto;padding:18px 16px}
.sidenav-scroll::-webkit-scrollbar{width:0}
.sidefoot{flex:none;display:flex;align-items:center;gap:9px;padding:12px 16px;border-top:1px solid rgba(255,255,255,.14)}
.sfavatar{width:28px;height:28px;border-radius:50%;background:rgba(91,95,239,.55);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;flex:none}
.sfname{font-size:12.5px;font-weight:600;color:#fff;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cust{display:flex;align-items:center;gap:9px;padding:2px 4px 16px;margin-bottom:14px;border-bottom:1px solid rgba(255,255,255,.14)}
.cust .cav{width:22px;height:22px;color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.cust .cn{font-size:13.5px;font-weight:600}
.cust-actions{margin-left:auto;display:flex;align-items:center;gap:2px}
.cust-ic{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.85);flex:none}
.cust-ic:hover{background:rgba(255,255,255,.1);color:#fff}
.navlist{display:flex;flex-direction:column;gap:2px;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,.14)}
.navitem{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:13px;color:rgba(255,255,255,.68);text-align:left}
.navitem .ic{width:16px;height:16px;flex:none;display:flex;align-items:center;justify-content:center}
.navitem:hover{background:rgba(255,255,255,.06);color:#fff}
.navitem.active{background:rgba(255,255,255,.12);color:#fff;font-weight:600}
.newconvo{display:flex;align-items:center;justify-content:center;gap:7px;background:rgba(91,95,239,.55);color:var(--primary-foreground);border-radius:9px;padding:10px;font-size:12.5px;font-weight:600;margin-bottom:18px;transition:background var(--duration-base) var(--ease-out)}
.newconvo:hover{background:rgba(91,95,239,.7)}
.recent-eyebrow{font-size:11px;font-weight:600;color:rgba(255,255,255,.42);margin-bottom:8px}
.convgroup{margin-bottom:4px}
.convgroup .gl{font-size:10px;color:rgba(255,255,255,.38);margin:8px 4px 4px}
.convitem{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:7px;font-size:12.5px;color:rgba(255,255,255,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.convitem:hover{background:rgba(255,255,255,.06);color:#fff}
.convitem.current{background:rgba(255,255,255,.1);color:#fff}

/* ---------- main pane / top bar ---------- */
.mainpane{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:52px;flex:none;display:flex;align-items:center;padding:0 22px;border-bottom:1px solid var(--border);position:relative}
.crumb{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--foreground);padding:6px 8px;border-radius:7px}
.crumb:hover{background:var(--muted)}
.crumb .sep{color:var(--faint);font-weight:400;margin:0 1px}
.crumb .agent{color:var(--primary)}
.crumb .car{width:16px;height:16px;color:var(--faint);margin-left:1px;display:inline-flex}

/* ---------- body ---------- */
.body{flex:1;display:flex;min-height:0}
.col{flex:1;min-width:0;display:flex;flex-direction:column}

/* filters panel — persistent right pane, not inline in the chat. no divider:
   the panel reads as a distinct surface by background/shadow, not a border */
.filterpanel{width:0;flex:none;background:var(--card);padding:16px 0;overflow:hidden;display:flex;flex-direction:column;transition:width .45s var(--ease),padding .45s var(--ease)}
.filterpanel.open{width:316px;padding:16px 48px 16px 16px;overflow-y:auto}
.filterpanel.notransition{transition:none!important}
.filterpanel::-webkit-scrollbar{width:0}
.fph{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--foreground);margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.fph .fic{width:16px;height:16px;flex:none;color:var(--muted-foreground);display:flex;align-items:center;justify-content:center}
.fph .fic svg{width:14px;height:14px}
.fp-empty{font-size:12px;line-height:1.6;color:var(--faint);padding-top:2px}
.scroll{flex:1;min-height:0;overflow-y:auto;scroll-behavior:smooth;padding:22px 34px 6px}
.convwrap{max-width:780px;margin:0 auto}
.scroll::-webkit-scrollbar{width:0}

/* ---------- landing ---------- */
.lwrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;text-align:center;padding:20px 0;transition:opacity .3s var(--ease)}
.lwrap.out{opacity:0}
.lmark{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.lhead{margin:0 0 24px;font-size:18px;font-weight:600;letter-spacing:-.005em;color:var(--foreground)}
.lpills{display:flex;flex-direction:column;gap:10px;width:100%;max-width:440px}
.lpill{border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--card);padding:12px 18px;font-size:12.5px;line-height:1.45;color:var(--ink-2);text-align:left}
.lpill:hover{border-color:var(--primary);background:var(--primary-subtle);color:var(--foreground)}

/* ---------- conversation (message/response layout intentionally left as-is
   for this pass — unverified against the actual product UI) ---------- */
.turn{display:flex;gap:11px;margin-bottom:16px}
.turn.user{justify-content:flex-end}
.ubub{background:var(--ground);border:1px solid var(--hairline-2);border-radius:var(--r);padding:9px 13px;font-size:13.5px;line-height:1.5;max-width:640px}
.aturn{display:block;margin-bottom:20px}
.agent{padding-top:2px}
.aline{font-size:13.5px;line-height:1.55;color:var(--ink);margin:0 0 10px;max-width:80ch}

/* message meta row: avatar + reaction icons + timestamp */
.mrow{display:flex;align-items:center;gap:9px;margin-top:14px}
.macts{display:flex;align-items:center;gap:1px}
.macts button{width:26px;height:26px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:var(--faint);transition:background var(--duration-fast) var(--ease-out),color var(--duration-fast) var(--ease-out)}
.macts button:hover{background:var(--muted);color:var(--ink-2)}
.mts{margin-left:auto;font-size:10.5px;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}

/* thinking (interpretation verb-cycle) — calm skeleton-pulse loading state,
   not an active-color spinner: this is idle waiting, not agent action */
.think{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted-foreground);font-weight:500;margin-bottom:9px;transition:opacity .3s var(--ease)}
.think.out{opacity:0}
.think-ico{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted-foreground);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.think-verb{transition:opacity .18s ease}
.think-verb.out{opacity:0}

/* reasoning block — collapsible, collapsed by default. No boxed/gray
   container: when open it's a plain, internally-scrollable region capped
   at a fixed height, with a mask-image fade (not a scrollbar) hinting at
   clipped content above/below. */
.rtog{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted-foreground);font-weight:500;margin-bottom:10px;padding:2px 0}
.rtog .bulb{width:14px;height:14px;display:inline-flex}
.rtog .car{width:14px;height:14px;display:inline-flex;transition:transform var(--duration-slow) var(--ease-out)}
.rtog.closed .car{transform:rotate(-90deg)}
.rbody{max-height:0;opacity:0;overflow:hidden;margin:0;padding:0;scrollbar-width:none;-ms-overflow-style:none;transition:max-height .45s var(--ease-out),opacity .3s var(--ease-out),margin .45s var(--ease-out)}
.rbody::-webkit-scrollbar{display:none}
.rbody.open{opacity:1;margin:0 0 15px;max-height:200px;overflow-y:auto;padding:2px 0 6px}
.rbody.open.fade-b{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 28px),transparent 100%);mask-image:linear-gradient(to bottom,#000 calc(100% - 28px),transparent 100%)}
.rbody.open.fade-t{-webkit-mask-image:linear-gradient(to bottom,transparent,#000 28px,#000 100%);mask-image:linear-gradient(to bottom,transparent,#000 28px,#000 100%)}
.rbody.open.fade-t.fade-b{-webkit-mask-image:linear-gradient(to bottom,transparent,#000 28px,#000 calc(100% - 28px),transparent 100%);mask-image:linear-gradient(to bottom,transparent,#000 28px,#000 calc(100% - 28px),transparent 100%)}
.rbody p{margin:0 0 9px;font-size:12.5px;line-height:1.6;color:var(--ink-2);max-width:70ch}
.rbody p:last-child{margin-bottom:0}
.rbody b{font-weight:600;color:var(--foreground)}

/* filter rows — live in the persistent right panel. plain neutral border
   only (no continuous accent bar down the edge); provenance is carried by
   a badge next to the label and a dashed/solid value-box border */
.frow{position:relative;padding:8px 8px 8px 4px;margin:0 -8px}
.frow-top{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.flabel{font-size:12.5px;font-weight:600;color:var(--foreground)}
.fassume{display:inline-flex;align-items:center;color:var(--primary)}
.frow-right{margin-left:auto;display:flex;align-items:center;gap:4px}
.fval{font-size:12px;font-weight:600;color:var(--foreground);font-variant-numeric:tabular-nums;white-space:nowrap}
.fx{width:16px;height:16px;display:flex;align-items:center;justify-content:center;color:var(--faint);border-radius:3px}
.fx svg{width:12px;height:12px}
.fx:hover{color:var(--no);background:var(--muted)}
.fselwrap{position:relative;display:block}
.fsel{appearance:none;-webkit-appearance:none;width:100%;border:1px solid var(--border);border-radius:4px;background:var(--card);padding:7px 28px 7px 10px;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--foreground);cursor:pointer}
.fsel:hover{border-color:var(--graphite)}
.fsel:focus{outline:none;border-color:var(--primary)}
.fselwrap .fcar{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--faint);pointer-events:none;display:flex}
/* slider filter control — thin track, purple fill up to the thumb (set via
   JS as a background gradient, since range inputs have no native
   fill-to-thumb styling that works the same across browsers) */
.fslwrap{padding:4px 0 2px}
.frange{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:var(--border);outline:none;cursor:pointer;margin:0}
.frange::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--card);border:2px solid var(--primary);box-shadow:var(--shadow-sm);cursor:pointer}
.frange::-moz-range-track{height:4px;border-radius:2px;background:var(--border)}
.frange::-moz-range-progress{height:4px;border-radius:2px;background:var(--primary)}
.frange::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--card);border:2px solid var(--primary);box-shadow:var(--shadow-sm);cursor:pointer}
.freason{margin:6px 0 0;font-size:11.5px;line-height:1.5;color:var(--graphite);max-width:64ch}
.freason b{color:var(--ink-2);font-weight:600}
.freason-txt.flash,.fval.flash,#bind-impedance.flash{border-radius:3px;animation:bindflash 1.1s var(--ease)}
@keyframes bindflash{0%{background:var(--primary-subtle)}100%{background:transparent}}
.frow.gone{max-height:0;opacity:0;margin:0;padding:0;border-top-width:0;overflow:hidden;transition:max-height .3s var(--ease),opacity .25s var(--ease),padding .3s var(--ease)}
.frow.flash{animation:frowflash 1.1s var(--ease)}
@keyframes frowflash{0%{background:rgba(91,95,239,.1)}100%{background:rgba(91,95,239,0)}}
/* recalculating state for a filter that depends on another filter just
   changed — a skeleton sweep instead of any spinner, matching the calm
   loading language used elsewhere in this prototype */
.frow.shimmer .fsel{color:transparent;border-color:transparent;background:linear-gradient(90deg,var(--muted) 25%,var(--hairline-2) 37%,var(--muted) 63%);background-size:400% 100%;animation:shimmersweep 1.2s ease-in-out infinite}
.frow.shimmer .fcar{opacity:0}
.frow.shimmer .freason{opacity:.4}
@keyframes shimmersweep{0%{background-position:135% 0}100%{background-position:-35% 0}}
/* full-response reload — the whole turn-2 answer (text, product strip,
   table) fades under a skeleton curtain and back, standing in for a
   response the agent is regenerating against a changed dependency,
   rather than reloading just the two dependent filter rows */
.recalcwrap{position:relative}
/* content and the skeleton curtain are two DIFFERENT classes, toggled
   sequentially in JS (content fades out and finishes, then the curtain
   fades in — never both at once) so there's never a moment where old text
   is legible through the loading state */
.recalcwrap > .aline,.recalcwrap .pstrip,.recalcwrap .ctable-wrap,.recalcwrap .cnotes{transition:opacity .25s var(--ease)}
.recalcwrap.content-hidden > .aline,.recalcwrap.content-hidden .pstrip,.recalcwrap.content-hidden .ctable-wrap,.recalcwrap.content-hidden .cnotes{opacity:0}
/* the feedback-icon/timestamp row sits after recalcwrap (it must stay the
   very last element in the turn), so it's faded by the same class name
   applied directly to it rather than via a recalcwrap-descendant selector */
.mrow{transition:opacity .25s var(--ease)}
.mrow.content-hidden{opacity:0}
.reload-overlay{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;gap:12px;padding-top:2px;background:var(--card);opacity:0;pointer-events:none;transition:opacity .25s var(--ease)}
.reload-overlay.show{opacity:1;pointer-events:auto}
/* a paragraph added *after* the reload (the recalc confirmation) starts
   genuinely collapsed — not just opacity:0 — so it reserves no space while
   waiting to appear; without this, the invisible-but-still-there paragraph
   pushes whatever follows it (the feedback icons) down by its own height,
   reading as inconsistent spacing during the loading phase. JS sets an
   explicit max-height at reveal time since a max-height transition can't
   target "auto." */
.recalc-collapse{max-height:0;opacity:0;overflow:hidden;margin:0;transition:max-height .45s var(--ease),opacity .35s var(--ease),margin .45s var(--ease)}
.recalc-collapse.in{opacity:1;margin:0 0 10px}
.skel-line,.skel-card,.skel-table{border-radius:var(--radius-sm);background:linear-gradient(90deg,var(--muted) 25%,var(--hairline-2) 37%,var(--muted) 63%);background-size:400% 100%;animation:shimmersweep 1.4s ease-in-out infinite}
.skel-line{height:11px}
.skel-cards{display:flex;gap:10px}
.skel-card{flex:1;height:58px}
.skel-table{height:92px}

/* product card strip */
.pstrip{margin-bottom:14px}
.pstrip .ph{font-size:11px;font-weight:500;color:var(--faint);margin-bottom:8px}
.pcards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pcard{border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--card);padding:11px 12px;display:flex;flex-direction:column;gap:4px}
.pcard .pid{display:inline-flex;align-items:baseline;gap:2px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--foreground)}
.pcard .pdesc{font-size:10.5px;line-height:1.4;color:var(--graphite)}

/* comparison table — recommended row marked by a left-border accent only,
   never a filled background */
.ctable-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:12px}
.ctable{width:100%;border-collapse:collapse;font-size:11.5px;min-width:460px}
.ctable th{text-align:left;font-size:10.5px;font-weight:600;color:var(--graphite);padding:8px 12px;border-bottom:1px solid var(--border);background:var(--muted)}
.ctable td{padding:8px 12px;border-bottom:1px solid var(--border);color:var(--ink-2);font-size:11px;font-variant-numeric:tabular-nums}
.ctable tr:last-child td{border-bottom:none}
.ctable .modelname{font-weight:600;color:var(--foreground)}
.ctable .modelname.rec-row{border-left:3px solid var(--primary);padding-left:9px}

/* candidate notes */
.cnote{font-size:12.5px;line-height:1.6;color:var(--ink-2);margin:0 0 6px;max-width:76ch}
.cnote b{font-weight:600;font-variant-numeric:tabular-nums;color:var(--foreground)}
.cnotes{margin-bottom:14px}

/* citation tags + hover source card — index badge + muted label, neutral at
   rest, no icon; a single element transitions on hover (no overlapping
   second element — the popover is a separate, position:absolute child that
   only ever affects opacity/transform, never stacks visually at rest) */
.ctag{position:relative;display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;color:var(--muted-foreground);background:var(--muted);border:1px solid var(--border);border-radius:var(--radius-sm);padding:2px 7px 2px 2px;margin:0 1px;cursor:default;white-space:nowrap;vertical-align:1px;transition:background var(--duration-base) var(--ease-out),color var(--duration-base) var(--ease-out),border-color var(--duration-base) var(--ease-out)}
.ctag .cidx{display:inline-flex;align-items:center;justify-content:center;min-width:14px;height:14px;font-size:9.5px;font-weight:700;font-variant-numeric:tabular-nums;border-radius:3px;background:var(--card);color:var(--foreground);transition:background var(--duration-base) var(--ease-out),color var(--duration-base) var(--ease-out)}
.ctag:hover,.ctag:focus-within{background:var(--primary-subtle);color:var(--primary);border-color:var(--primary);outline:none}
.ctag:hover .cidx,.ctag:focus-within .cidx{background:var(--primary);color:#fff}
.cbadge{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:15px;height:15px;font-size:9.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted-foreground);background:var(--muted);border:1px solid var(--border);border-radius:var(--radius-sm);padding:0 4px;margin-left:6px;cursor:default;vertical-align:2px;transition:background var(--duration-base) var(--ease-out),color var(--duration-base) var(--ease-out),border-color var(--duration-base) var(--ease-out)}
.cbadge:hover,.cbadge:focus-within{background:var(--primary);color:#fff;border-color:var(--primary);outline:none}
/* citation popover renders as a single shared node inside #frame (not
   nested under .scroll), positioned via JS from the trigger's bounding box —
   this keeps it from being clipped by .scroll's overflow or painted under
   the topbar the way a same-context CSS-hover popover would be */
.cpop-host{position:absolute;width:264px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-md);padding:12px 13px;opacity:0;transform:translateY(6px);pointer-events:none;transition:opacity .18s var(--ease-out),transform .18s var(--ease-out);z-index:50;white-space:normal;text-align:left}
.cpop-host.show{opacity:1;transform:none}
.cpop-src{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--graphite);margin-bottom:7px}
.cpop-src .globe{width:14px;height:14px;display:flex}
.cpop-src .ext{margin-left:auto;color:var(--faint);width:14px;height:14px;display:flex}
.cpop-title{display:block;font-size:13px;font-weight:600;color:var(--foreground);line-height:1.35;margin-bottom:6px}

.recs{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:14px;align-items:stretch}

.rec.out{opacity:.72}

.rec .pn{display:flex;align-items:baseline;gap:6px;font-size:14.5px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}

.reqs{padding:2px 12px 0}
.req{display:grid;grid-template-columns:14px 1fr;gap:8px;align-items:start;padding:7px 0;border-bottom:1px solid var(--border)}
.req:last-child{border-bottom:none}
.vd{width:14px;height:14px;display:flex}
.vd.yes{color:var(--trace)}
.vd.no{color:var(--no)}
.req .rn{display:block;font-size:11.5px;font-weight:600;color:var(--foreground);line-height:1.35}
.req .rv2{display:block;font-size:10px;color:var(--graphite);margin-top:2px;line-height:1.4;font-variant-numeric:tabular-nums}
.req.miss .rn,.req.miss .rv2{color:var(--no)}
.rfoot{padding:9px 12px 11px;background:var(--muted);border-top:1px solid var(--border);margin-top:auto}
.rfoot p{margin:0;font-size:11px;line-height:1.55;color:var(--ink-2)}

/* action bar (docked) — neutral-outline (secondary) */
.actbar{flex:none;padding:0 26px 6px;display:flex;gap:8px;flex-wrap:wrap}
.actbar[hidden]{display:none}
.actbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:5px;padding:7px 12px;font-size:12px;color:var(--ink-2);background:var(--card);transition:background var(--duration-base) var(--ease-out)}
.actbtn:hover{background:var(--muted)}
.actbtn .ic{width:14px;height:14px;display:flex;color:var(--muted-foreground)}

/* input bar — card background, border-only focus, no glow */
.inbar{flex:none;padding:6px 26px 10px;background:var(--card)}
.infield{display:flex;align-items:center;gap:9px;border:1px solid var(--border);border-radius:var(--radius-md);padding:10px 12px;background:var(--card);transition:border-color var(--duration-base) var(--ease-out)}
.infield.hot{border-color:var(--primary)}
.intext{flex:1;font-size:13px;color:var(--foreground);min-height:19px;line-height:19px}
.intext.ph{color:var(--faint)}
.caret{display:inline-block;width:1.5px;height:14px;background:var(--primary);vertical-align:-2px;margin-left:1px;animation:blink 1s steps(1,end) infinite}
@keyframes blink{50%{opacity:0}}
.attach,.mic{width:16px;height:16px;display:flex;color:var(--faint);flex:none}
.send{width:26px;height:26px;border-radius:50%;background:var(--primary-subtle);color:var(--primary);display:flex;align-items:center;justify-content:center;flex:none;transition:background .3s var(--ease-out),color .3s var(--ease-out),transform .3s var(--ease-out)}
.send svg{width:16px;height:16px}
.send.on{background:var(--primary);color:var(--primary-foreground)}
.send.fire{transform:scale(.85)}

/* brand footer */
.brandbar{flex:none;display:flex;align-items:center;justify-content:flex-end;gap:9px;padding:7px 26px;background:var(--card);font-size:10px;color:var(--faint)}
.brandbar b{color:var(--ink-2);font-weight:600}
.brandbar .ic{width:14px;height:14px;display:flex;color:var(--faint)}

/* ---------- reveal ---------- */
.rv{opacity:0;transform:translateY(10px)}
.rv.in{opacity:1;transform:none;transition:opacity .7s var(--ease),transform .7s var(--ease)}

/* ---------- step control ---------- */
#steps{margin-top:14px;display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:7px 9px;box-shadow:var(--shadow-sm);flex:none}
#steps.hide{display:none}
#steps button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 8px;border-radius:7px;min-width:72px}
#steps button:hover{background:var(--muted)}
#steps button.on{background:var(--navy)}
#steps .num{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--graphite)}
#steps .lab{font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
#steps button.on .num,#steps button.on .lab{color:#fff}
#steps .hint{font-size:10px;color:var(--faint);padding-left:8px;border-left:1px solid var(--border);margin-left:4px;line-height:1.45;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}

function updateRangeFill(input){
  var min = +input.min, max = +input.max, val = +input.value;
  var pct = max === min ? 0 : ((val - min) / (max - min)) * 100;
  input.style.background = 'linear-gradient(to right, var(--primary) 0%, var(--primary) ' + pct + '%, var(--border) ' + pct + '%, var(--border) 100%)';

function flashEl(el){

function flashRow(row){

/* drives a slider filter's own 'input' event programmatically, in small
   steps, so a scripted state can visibly slide a filter to a new value the
   same way a dragged thumb would — reusing the real update path instead of
   a separate fake animation */
function animateSliderTo(id, target, dur, done){
  var input = filterpanel.querySelector('.frange[data-id="' + id + '"]');
  if(!input){ if(done) done(); return; }
  var start = +input.value;
  var steps = Math.max(6, Math.round(dur / 25));
  var i = 0;
  function tick(){
    i++;
    var t = i / steps;
    var eased = 1 - Math.pow(1 - t, 3); /* ease-out cubic — glides to a stop instead of a linear snap */
    var v = Math.round(start + (target - start) * eased);
    input.value = v;
    input.dispatchEvent(new CustomEvent('input', { bubbles: true, detail: { silent: i < steps } }));
    if(i < steps) at(dur / steps, tick);
    else if(done) done();
  }
  tick();
}
filterpanel.addEventListener('input', function(e){
  var input = e.target.closest('.frange');
  if(!input) return;
  updateRangeFill(input);
  var f = FILTERS.filter(function(x){ return x.id === input.dataset.id; })[0];
  if(!f) return;
  f.value = f.numeric ? +input.value : f.options[+input.value];
  var row = input.closest('.frow');
  var valEl = row.querySelector('.fval');
  if(valEl) valEl.textContent = fvalText(f);
  /* scripted mid-slide ticks (e.detail.silent) just update the number as it
     counts past — the reason/chat-text/flash only fire once, on the tick
     that settles on the final value, so an auto-driven slide doesn't spam
     the flash animation a dozen times in a row */
  if(e.detail && e.detail.silent) return;
  var reasonEl = row.querySelector('.freason-txt');
  if(reasonEl) reasonEl.textContent = currentReason(f);
  flashEl(reasonEl);
  flashEl(valEl);
  if(f.bindId){
    var bound = document.getElementById(f.bindId);
    if(bound){
      var text = typeof f.chatText === 'function' ? f.chatText(f.value) : (f.chatText && f.chatText[f.value]) || f.value;
      bound.textContent = text;
      flashEl(bound);
    }
  }
});

  var num = +trigger.dataset.cite;
  var c = CITATIONS[num - 1];
  citepop.innerHTML =
    '<span class="cpop-src"><span class="globe">' + ico(I.globe, 14) + '</span>rapidflare.ai<span class="ext">' + ico(I.externalLink, 14) + '</span></span>' +
    '<span class="cpop-title">' + c.title + '</span>' +
    '<span class="cpop-tag">' + c.tag + '</span>' +
    '<span class="cpop-quote">&ldquo;' + c.quote + '&rdquo;</span>' +
    '<span class="cpop-foot">' + citeFooter(num) + '</span>';
  var frameRect = frameEl.getBoundingClientRect();
  var trigRect = trigger.getBoundingClientRect();
  var scale = frameRect.width / 1280;
  var left = (trigRect.left - frameRect.left) / scale;
  var top = (trigRect.top - frameRect.top) / scale;
  var trigH = trigRect.height / scale;
  citepop.style.left = Math.max(8, Math.min(left, 1280 - 264 - 8)) + 'px';
  citepop.classList.add('show');
  var popH = citepop.offsetHeight;
  var openUp = top - popH - 9 > 60;
  citepop.style.top = (openUp ? (top - popH - 9) : (top + trigH + 9)) + 'px';
}
function hideCitePop(){ citepop.classList.remove('show'); }
scroll.addEventListener('mouseover', function(e){
  var t = e.target.closest('.ctag,.cbadge');
  if(t) showCitePop(t);
});
scroll.addEventListener('mouseout', function(e){
  var t = e.target.closest('.ctag,.cbadge');
  if(t && !t.contains(e.relatedTarget)) hideCitePop();
});
scroll.addEventListener('focusin', function(e){
  var t = e.target.closest('.ctag,.cbadge');
  if(t) showCitePop(t);
});
scroll.addEventListener('focusout', function(e){
  var t = e.target.closest('.ctag,.cbadge');
  if(t) hideCitePop();
});

/* typing */
function type(text, dur, done){
  var i = 0, per = dur / text.length;
  intext.className = 'intext';
  intext.textContent = '';
  infield.classList.add('hot');
  function step(){
    i++;
    intext.innerHTML = text.slice(0, i).replace(/</g,'&lt;') + '<span class="caret"></span>';
    if(i < text.length){ at(per, step); }
    else { send.classList.add('on'); at(260, function(){ if(done) done(); }); }
  }
  at(120, step);
}
function fire(done){
  send.classList.add('fire');
  at(180, function(){
    send.className = 'send';
    infield.classList.remove('hot');
    intext.className = 'intext ph';
    intext.textContent = 'Ask a follow-up question…';
    if(done) done();
  });
}

/* ---------- per-state animations ---------- */
var ANIM = {

  /* landing + interpretation combined: pause on the suggestion pills, fade
     into the typed prompt and its submission, then continue straight into
     the agent's first response (thinking → reasoning → paragraphs →
     question) — one continuous take instead of two separate states */
  1: function(){
    at(1500, function(){
      type(PROMPT1, 1100, function(){
        fire(function(){
          var lwrap = scroll.querySelector('.lwrap');
          if(lwrap) lwrap.classList.add('out');
          at(320, function(){
            scroll.innerHTML = '<div class="convwrap">' + buildFull(1) + '</div>';
            void scroll.offsetHeight;
            at(30, function(){
              show(document.getElementById('ut1'));
              toBottom(true);
              runThinking(function(){
                var think = document.getElementById('think');
                if(think) think.classList.add('out');
                at(240, function(){
                  if(think) think.style.display = 'none';
                  actbar.hidden = false;
                  show(document.getElementById('rwrap1'));
                  at(160, toBottom);
                  at(300, function(){ filterpanel.classList.add('open'); });
                  at(600, function(){ revealFilterPanel(); toBottom(); });
                  at(1000, function(){ show(document.getElementById('p1')); toBottom(); });
                  at(1400, function(){ show(document.getElementById('p2')); toBottom(); });
                  at(1800, function(){ show(document.getElementById('p3')); toBottom(); });
                  at(2300, function(){ show(document.getElementById('q1')); toBottom(); });
                  at(2600, function(){ show(scroll.querySelector('[data-k="mrow1"]')); toBottom(); });
                });
              });
            });
          });
        });
      });
    });
  },

  /* recalculate: now sits right after the first interpretation, before the
     shortlist exists — so it's turn 1's own filters/response that visibly
     "reconsider," not turn 2's. Drag impedance to 80 Ω, let Radiation
     pattern (the only other turn-1 filter) shimmer, then land the agent's
     own confirmation that the 24→20 narrowing still holds */
  2: function(){
    at(500, function(){
      animateSliderTo('impedance', 80, 950, function(){
        at(350, function(){
          var patternRow = document.getElementById('frow-pattern');
          var wrap = document.getElementById('recalcwrap1');
          var overlay = document.getElementById('reloadOverlay1');
          var mrow1 = document.getElementById('mrow1el');
          /* sequenced, not simultaneous: let the old content fully fade to
             nothing first, then bring the skeleton in — otherwise the two
             cross-fade and old text stays legible through the loading state */
          if(wrap) wrap.classList.add('content-hidden');
          if(mrow1) mrow1.classList.add('content-hidden');
          toBottom();
          at(260, function(){
            if(overlay) overlay.classList.add('show');
            if(patternRow) patternRow.classList.add('shimmer');
            toBottom();
            /* full response sits under the skeleton curtain for a couple of
               seconds — long enough to read as "regenerating," not a glitch */
            at(2300, function(){
              if(overlay) overlay.classList.remove('show');
              if(patternRow){ patternRow.classList.remove('shimmer'); }
              at(260, function(){
                if(wrap) wrap.classList.remove('content-hidden');
                if(mrow1) mrow1.classList.remove('content-hidden');
                if(patternRow) flashRow(patternRow);
                toBottom();
                at(300, function(){
                  var recalc1 = scroll.querySelector('[data-k="recalc1"]');
                  if(recalc1){ recalc1.style.maxHeight = recalc1.scrollHeight + 'px'; show(recalc1); }
                  toBottom();
                });
              });
            });
          });
        });
      });
    });
  },

  3: function(){
    var ut2 = document.getElementById('ut2');
    var turn2 = document.getElementById('turn2');
    if(ut2) ut2.style.opacity = 0;
    if(turn2) turn2.classList.add('rv');
    type(PROMPT2, 900, function(){
      fire(function(){
        if(ut2){ ut2.style.opacity = ''; ut2.classList.add('in'); }
        at(280, function(){ show(turn2); toBottom(); });
        at(560, function(){ revealFilterPanel(); toBottom(); });
        at(650, function(){ show(document.getElementById('rwrap2')); toBottom(); });
        at(1250, function(){ show(scroll.querySelector('[data-k="lead2"]')); toBottom(); });
        at(1700, function(){ show(scroll.querySelector('[data-k="why2"]')); toBottom(); });
        at(2200, function(){ show(scroll.querySelector('[data-k="strip"]')); toBottom(); });
        at(2700, function(){ show(scroll.querySelector('[data-k="table"]')); toBottom(); });
        at(3200, function(){ show(scroll.querySelector('[data-k="notes"]')); toBottom(); });
        at(3750, function(){ show(document.getElementById('q2')); toBottom(); });
        at(4050, function(){ show(scroll.querySelector('[data-k="mrow2"]')); toBottom(); });
      });
    });
  },

  4: function(){
    var ut3 = document.getElementById('ut3');
    var turn3 = document.getElementById('turn3');
    if(ut3) ut3.style.opacity = 0;
    if(turn3) turn3.classList.add('rv');
    type(PROMPT3, 900, function(){
      fire(function(){
        if(ut3){ ut3.style.opacity = ''; ut3.classList.add('in'); }
        at(280, function(){ show(turn3); toBottom(); });
        at(560, function(){ revealFilterPanel(); toBottom(); });
        at(650, function(){ show(document.getElementById('rwrap3')); toBottom(); });
        at(1250, function(){ show(scroll.querySelector('[data-k="lead3"]')); toBottom(); });
        at(1650, function(){
          show(scroll.querySelector('[data-k="recs"]'));
          var cards = scroll.querySelectorAll('.rec');
          Array.prototype.forEach.call(cards, function(c, i){
            c.classList.add('rv');
            at(i * 200, function(){ c.classList.add('in'); });
          });
          toBottom();
        });
        at(2500, function(){ show(scroll.querySelector('[data-k="summary"]')); toBottom(); });
        at(2950, function(){ show(scroll.querySelector('[data-k="close"]')); toBottom(); });
        at(3250, function(){ show(scroll.querySelector('[data-k="mrow3"]')); toBottom(); });
      });
    });
  },

  5: function(){
    var mark = scroll.querySelector('.lmark'), head = scroll.querySelector('.lhead'), pills = scroll.querySelector('.lpills');
    [mark, head, pills].forEach(function(el, i){
      if(!el) return;
      el.classList.add('rv');
      at(150 + i * 160, function(){ el.classList.add('in'); });
    });
  }
};

/* ---------- step control ---------- */
var current = 1;
function paintSteps(n){
  Array.prototype.forEach.call(stepsBar.children, function(b){
    if(b.dataset.n) b.classList.toggle('on', +b.dataset.n === n);
  });
}
function buildSteps(){
  var h = '';
  for(var i = 1; i <= LAST; i++){
    h += '<button data-n="' + i + '"><span class="num">' + i + '</span><span class="lab">' + STEP_LABELS[i-1] + '</span></button>';
  }
  h += '<span class="hint">H hide bar<br>&#8592; &#8594; step &#183; R replay</span>';
  stepsBar.innerHTML = h;
  stepsBar.addEventListener('click', function(e){
    var b = e.target.closest('button[data-n]');
    if(b) go(+b.dataset.n);
  });
}
function go(n){ current = n; render(n); }

document.addEventListener('keydown', function(e){
  var k = e.key.toLowerCase();
  if(k === 'h'){ stepsBar.classList.toggle('hide'); fit(); return; }
  if(k === 'r'){ go(current); return; }
  if(e.key === 'ArrowRight' || e.key === ' '){ e.preventDefault(); go(Math.min(LAST, current + 1)); return; }
  if(e.key === 'ArrowLeft'){ e.preventDefault(); go(Math.max(1, current - 1)); return; }
  if(k >= '1' && k <= String(LAST)){ go(+k); }
});

/* ---------- fit ---------- */
var scaler = document.getElementById('scaler');
function fit(){
  var barH = stepsBar.classList.contains('hide') ? 0 : stepsBar.offsetHeight + 14;
  var s = Math.min((window.innerWidth - 32) / 1280, (window.innerHeight - 32 - barH) / 720);
  scaler.style.transform = 'scale(' + s + ')';
  scaler.style.height = (720 * s) + 'px';
}
window.addEventListener('resize', fit);

buildSteps();
fit();
go(1);
})();
