<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rapidflare Select</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ink:#151832;
  --ink-2:#3D4260;
  --muted:#6B7089;
  --faint:#8A8FA6;
  --line:#E4E5F0;
  --line-2:#EFEFF7;
  --surface:#FFFFFF;
  --ground:#F5F6FB;
  --tint:#EEEDFC;
  --tint-2:#F6F5FD;
  --indigo:#4B45C6;
  --indigo-d:#3A34A8;
  --navy:#1B1F5C;
  --no:#B4362C;
  --r:10px;
  --ease:cubic-bezier(.22,.72,.28,1);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
table{font-family:inherit}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}

/* ---------- stage ---------- */
#stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:16px}
#scaler{width:1280px;height:720px;transform-origin:top center;flex:none}
#frame{width:1280px;height:720px;background:var(--surface);border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgba(21,24,50,.06),0 18px 48px -20px rgba(21,24,50,.28);display:flex;flex-direction:row;position:relative}

/* ---------- side nav ---------- */
.sidenav{width:250px;flex:none;background:var(--navy);color:#fff;display:flex;flex-direction:column;padding:18px 16px;overflow-y:auto}
.sidenav::-webkit-scrollbar{width:0}
.cust{display:flex;align-items:center;gap:9px;padding:2px 4px 16px;margin-bottom:14px;border-bottom:1px solid rgba(255,255,255,.14)}
.cust .cav{width:26px;height:26px;border-radius:7px;background:var(--indigo);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none}
.cust .cn{font-size:13.5px;font-weight:600}
.navlist{display:flex;flex-direction:column;gap:2px;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,.14)}
.navitem{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:13px;color:rgba(255,255,255,.68);text-align:left}
.navitem .ic{font-size:13px;width:15px;text-align:center;flex:none}
.navitem:hover{background:rgba(255,255,255,.06);color:#fff}
.navitem.active{background:rgba(255,255,255,.12);color:#fff;font-weight:600}
.newconvo{display:flex;align-items:center;justify-content:center;gap:7px;background:var(--indigo);color:#fff;border-radius:9px;padding:10px;font-size:12.5px;font-weight:600;margin-bottom:18px}
.newconvo:hover{background:var(--indigo-d)}
.recent-eyebrow{font-size:9.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:8px}
.convgroup{margin-bottom:4px}
.convgroup .gl{font-size:10px;color:rgba(255,255,255,.38);margin:8px 4px 4px}
.convitem{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:7px;font-size:12.5px;color:rgba(255,255,255,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.convitem:hover{background:rgba(255,255,255,.06);color:#fff}
.convitem.current{background:rgba(255,255,255,.1);color:#fff}
.seeall{display:block;text-align:center;font-size:11.5px;color:rgba(255,255,255,.5);padding:10px 0 2px;margin-top:6px}
.seeall:hover{color:#fff}

/* ---------- main pane / top bar ---------- */
.mainpane{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:52px;flex:none;display:flex;align-items:center;padding:0 22px;border-bottom:1px solid var(--line-2);position:relative}
.crumb{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--ink);padding:6px 8px;border-radius:7px}
.crumb:hover{background:var(--ground)}
.crumb .sep{color:var(--faint);font-weight:400;margin:0 1px}
.crumb .agent{color:var(--indigo)}
.crumb .car{font-size:9px;color:var(--faint);margin-left:1px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.helpbtn{font-size:12.5px;color:var(--ink-2);font-weight:500}
.helpbtn:hover{color:var(--indigo)}
.useravatar{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:var(--ground)}
.helpmenu{position:absolute;top:48px;right:22px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px -12px rgba(21,24,50,.28);padding:6px;min-width:168px;opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .2s var(--ease),transform .2s var(--ease);z-index:20}
.helpmenu.open{opacity:1;transform:none;pointer-events:auto}
.helpmenu button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:7px;font-size:12.5px;color:var(--ink-2)}
.helpmenu button:hover{background:var(--ground);color:var(--ink)}

/* ---------- body ---------- */
.body{flex:1;display:flex;min-height:0}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;scroll-behavior:smooth;padding:22px 34px 6px}
.scroll::-webkit-scrollbar{width:0}

/* ---------- landing ---------- */
.av{width:30px;height:30px;flex:none;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px}
.lwrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;text-align:center;padding:20px 0}
.lmark{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:18px}
.lhead{margin:0 0 26px;font-size:22px;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
.lpills{display:flex;flex-direction:column;gap:10px;width:100%;max-width:440px}
.lpill{border:1px solid var(--line);border-radius:20px;background:var(--surface);padding:12px 20px;font-size:12.5px;line-height:1.45;color:var(--ink-2);text-align:center}
.lpill:hover{border-color:#C9C6F2;background:var(--tint-2);color:var(--ink)}

/* ---------- conversation ---------- */
.eyebrow{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:12px}
.turn{display:flex;gap:11px;margin-bottom:16px}
.turn .av{width:26px;height:26px;font-size:11px}
.turn.user .av{background:var(--line-2);color:var(--muted);border:1px solid var(--line)}
.ubub{background:var(--ground);border:1px solid var(--line-2);border-radius:var(--r);padding:9px 13px;font-size:13.5px;line-height:1.5;max-width:640px}
.aturn{display:block;margin-bottom:20px}
.agent{padding-top:2px}
.aline{font-size:13.5px;line-height:1.55;color:var(--ink);margin:0 0 10px;max-width:80ch}

/* message meta row: avatar + reaction icons + timestamp */
.mrow{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.mrow .av{width:26px;height:26px;font-size:11px;flex:none}
.macts{display:flex;align-items:center;gap:1px}
.macts button{width:23px;height:23px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:12px;line-height:1}
.macts button:hover{background:var(--ground);color:var(--ink-2)}
.mts{margin-left:auto;font-size:10.5px;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}

/* thinking (interpretation verb-cycle) */
.think{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--indigo);font-weight:500;margin-bottom:9px;transition:opacity .3s var(--ease)}
.think.out{opacity:0}
.think-ico{display:inline-block;font-size:11px;line-height:1;animation:spin 1.6s linear infinite;transform-origin:50% 52%}
@keyframes spin{to{transform:rotate(360deg)}}
.think-verb{transition:opacity .18s ease}
.think-verb.out{opacity:0}

/* reasoning block — collapsible, collapsed by default, never wraps the filters card */
.rtog{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--indigo);font-weight:500;margin-bottom:10px;padding:2px 0}
.rtog .bulb{font-size:11px}
.rtog .car{font-size:9px;transition:transform .3s var(--ease)}
.rtog.closed .car{transform:rotate(-90deg)}
.rbody{max-height:0;opacity:0;overflow:hidden;margin:0;border-left:2px solid var(--line);padding-left:15px;transition:max-height .45s var(--ease),opacity .3s var(--ease),margin .45s var(--ease)}
.rbody.open{opacity:1;margin:0 0 15px}
.rbody p{margin:0 0 9px;font-size:12.5px;line-height:1.6;color:var(--ink-2);max-width:70ch}
.rbody p:last-child{margin-bottom:0}
.rbody b{font-weight:600;color:var(--ink)}

/* filters card — cumulative recap, always visible */
.fcard{border:1px solid #C9C6F2;border-radius:12px;background:var(--surface);padding:14px 16px 12px;margin:0 0 16px;max-width:560px;box-shadow:0 6px 20px -14px rgba(75,69,198,.5)}
.fcard-h{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--indigo);margin-bottom:10px}
.fcard-h .fic{width:17px;height:17px;flex:none;border-radius:5px;background:var(--indigo);color:#fff;display:flex;align-items:center;justify-content:center;font-size:9px}
.frow{position:relative;padding:10px;margin:0 -10px;border-radius:9px}
.frow + .frow{border-top:1px solid var(--line-2)}
.frow-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.flabel{font-size:12.5px;font-weight:600;color:var(--ink)}
.fstate{font-size:8.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--indigo-d);border:1px dashed var(--indigo);border-radius:4px;padding:1px 5px}
.fx{margin-left:auto;color:var(--faint);font-size:13px;line-height:1;padding:1px 5px;border-radius:5px}
.fx:hover{color:var(--no);background:var(--ground)}
.fselwrap{position:relative;display:block}
.fsel{appearance:none;-webkit-appearance:none;width:100%;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 30px 8px 11px;font-size:12.5px;color:var(--ink);font-family:inherit;cursor:pointer}
.fsel:hover{border-color:#C9C6F2}
.fsel:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 3px rgba(75,69,198,.1)}
.frow.assumed .fsel{border-style:dashed;border-color:#B9B4EE}
.fselwrap .fcar{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--faint);pointer-events:none}
.freason{margin:7px 0 0;font-size:11.5px;line-height:1.5;color:var(--muted);max-width:64ch}
.freason b{color:var(--indigo);font-weight:600}
.fapply{display:inline-flex;align-items:center;gap:6px;margin-top:10px;border:1px solid var(--indigo);color:var(--indigo);background:var(--surface);border-radius:8px;padding:6px 14px;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;transition:background .25s var(--ease),color .25s var(--ease),border-color .25s var(--ease)}
.fapply:hover{background:var(--tint)}
.fcard.dirty .fapply{background:var(--indigo);color:#fff}
.fapply.flash{background:var(--navy);border-color:var(--navy);color:#fff}
.frow.gone{max-height:0;opacity:0;margin:0;padding:0;border-top-width:0;overflow:hidden;transition:max-height .3s var(--ease),opacity .25s var(--ease),padding .3s var(--ease)}
.frow.flash{animation:frowflash 1.1s var(--ease)}

/* rows tucked behind "+N more" — collapsed by default, revealed in place */
.frow-extra{max-height:0;opacity:0;margin:0;padding:0;border-top-width:0;overflow:hidden;transition:max-height .35s var(--ease),opacity .3s var(--ease),padding .35s var(--ease),margin .35s var(--ease)}
.fcard.expanded .frow-extra{max-height:170px;opacity:1;margin:0 -10px;padding:10px;border-top-width:1px}
.fmore{display:flex;align-items:center;gap:6px;width:100%;padding:9px 10px;margin:2px -10px 0;border-top:1px solid var(--line-2);font-size:11.5px;font-weight:600;color:var(--indigo)}
.fmore:hover{color:var(--indigo-d)}
.fmore-ic{font-size:9px;transition:transform .25s var(--ease)}
.fcard.expanded .fmore-ic{transform:rotate(180deg)}
@keyframes frowflash{0%{background:rgba(75,69,198,.11)}100%{background:rgba(75,69,198,0)}}

/* product card strip */
.pstrip{margin-bottom:14px}
.pstrip .ph{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.pcards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pcard{border:1px solid #DEDCF4;border-radius:9px;background:var(--tint-2);padding:11px 12px;display:flex;flex-direction:column;gap:4px}
.pcard .pid{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13px;font-weight:600;color:var(--indigo-d)}
.pcard .pdesc{font-size:10.5px;line-height:1.4;color:var(--muted)}
.pcard .pgo{align-self:flex-end;color:var(--indigo);font-size:12px;margin-top:1px}

/* comparison table */
.ctable-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:9px;margin-bottom:12px}
.ctable{width:100%;border-collapse:collapse;font-size:11.5px;min-width:460px}
.ctable th{text-align:left;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:8px 12px;border-bottom:1px solid var(--line);background:var(--ground)}
.ctable td{padding:8px 12px;border-bottom:1px solid var(--line-2);color:var(--ink-2)}
.ctable tr:last-child td{border-bottom:none}
.ctable .modelname{font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:600;color:var(--ink)}

/* candidate notes */
.cnote{font-size:12.5px;line-height:1.6;color:var(--ink-2);margin:0 0 6px;max-width:76ch}
.cnote b{font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:600;color:var(--ink)}
.cnotes{margin-bottom:14px}

/* citation tags + hover source card */
.ctag{position:relative;display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--indigo-d);background:var(--tint);border:1px solid #DCD9F5;border-radius:5px;padding:1px 6px;margin:0 1px;cursor:default;white-space:nowrap;vertical-align:1px}
.ctag-ar{font-size:9px}
.ctag:hover,.ctag:focus-within{background:var(--indigo);color:#fff;border-color:var(--indigo);outline:none}
.cbadge{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:15px;height:15px;font-size:9.5px;font-weight:700;color:var(--indigo-d);background:var(--tint);border:1px solid #DCD9F5;border-radius:4px;padding:0 4px;margin-left:6px;cursor:default;vertical-align:2px}
.cbadge:hover,.cbadge:focus-within{background:var(--indigo);color:#fff;border-color:var(--indigo);outline:none}
.cpop{position:absolute;bottom:calc(100% + 9px);left:0;width:264px;background:var(--surface);border:1px solid var(--line);border-radius:11px;box-shadow:0 16px 40px -16px rgba(21,24,50,.32);padding:12px 13px;opacity:0;transform:translateY(6px);pointer-events:none;transition:opacity .18s var(--ease),transform .18s var(--ease);z-index:30;white-space:normal;text-align:left}
.ctag:hover .cpop,.ctag:focus-within .cpop,.cbadge:hover .cpop,.cbadge:focus-within .cpop{opacity:1;transform:none;pointer-events:auto}
.cpop-src{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--muted);margin-bottom:7px}
.cpop-src .globe{font-size:10px}
.cpop-src .ext{margin-left:auto;color:var(--faint);font-size:10px}
.cpop-title{display:block;font-size:13px;font-weight:600;color:var(--ink);line-height:1.35;margin-bottom:6px}
.cpop-tag{display:inline-block;font-size:9.5px;font-weight:600;color:var(--indigo-d);background:var(--tint);border-radius:5px;padding:2px 7px;margin-bottom:8px}
.cpop-quote{display:block;font-size:11.5px;font-style:italic;line-height:1.55;color:var(--ink-2);border-left:2px solid var(--line);padding-left:9px;margin-bottom:10px}
.cpop-foot{display:flex;flex-wrap:wrap;gap:5px;border-top:1px solid var(--line-2);padding-top:9px}
.cpill{display:inline-flex;align-items:center;font-size:9.5px;font-weight:600;color:var(--ink-2);background:var(--ground);border:1px solid var(--line);border-radius:5px;padding:3px 6px}
.cpill.active{color:var(--indigo);border-color:var(--indigo);background:var(--tint)}

/* recommendation cards */
.recs{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:14px;align-items:start}
.rec{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;transition:box-shadow .6s var(--ease),border-color .6s var(--ease),opacity .6s var(--ease)}
.rec.win{border-color:var(--indigo);box-shadow:0 0 0 3px rgba(75,69,198,.09)}
.rec.out{opacity:.75}
.rec .rh{display:flex;align-items:flex-start;gap:8px;padding:11px 12px 9px;border-bottom:1px solid var(--line-2)}
.rec .pn{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.rec .sub{font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.badge{margin-left:auto;flex:none;font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;background:var(--indigo);color:#fff;border-radius:5px;padding:4px 7px}
.badge.alt{background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.reqs{padding:2px 12px 0}
.req{display:grid;grid-template-columns:14px 1fr;gap:8px;align-items:start;padding:7px 0;border-bottom:1px solid var(--line-2)}
.req:last-child{border-bottom:none}
.vd{font-size:11px;line-height:1.4;font-weight:700}
.vd.yes{color:var(--indigo)}
.vd.no{color:var(--no)}
.req .rn{font-size:11.5px;font-weight:600;color:var(--ink);line-height:1.35}
.req .rv2{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;color:var(--muted);margin-top:1px;line-height:1.4}
.req.miss .rn,.req.miss .rv2{color:var(--no)}
.rfoot{padding:9px 12px 11px;background:var(--ground);border-top:1px solid var(--line-2);margin-top:7px}
.rfoot p{margin:0;font-size:11px;line-height:1.55;color:var(--ink-2)}

/* action bar (docked) */
.actbar{flex:none;padding:0 26px 10px;display:flex;gap:8px;flex-wrap:wrap;transition:opacity .3s var(--ease)}
.actbar[hidden]{display:none}
.actbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:12px;color:var(--ink-2);background:var(--surface)}
.actbtn:hover{background:var(--ground)}
.actbtn .ic{font-size:12px;color:var(--indigo)}

/* input bar */
.inbar{flex:none;padding:12px 26px 10px;background:var(--surface)}
.infield{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.infield.hot{border-color:#C9C6F2;box-shadow:0 0 0 3px rgba(75,69,198,.08)}
.intext{flex:1;font-size:13px;color:var(--ink);min-height:19px;line-height:19px}
.intext.ph{color:var(--faint)}
.caret{display:inline-block;width:1.5px;height:14px;background:var(--indigo);vertical-align:-2px;margin-left:1px;animation:blink 1s steps(1,end) infinite}
@keyframes blink{50%{opacity:0}}
.attach,.mic{color:var(--faint);font-size:13px;flex:none}
.send{width:26px;height:26px;border-radius:50%;background:var(--tint);color:var(--indigo);display:flex;align-items:center;justify-content:center;font-size:12px;flex:none;transition:background .3s var(--ease),color .3s var(--ease),transform .3s var(--ease)}
.send.on{background:var(--indigo);color:#fff}
.send.fire{transform:scale(.85)}

/* brand footer */
.brandbar{flex:none;display:flex;align-items:center;justify-content:flex-end;gap:9px;padding:7px 26px;background:var(--surface);font-size:10px;color:var(--faint)}
.brandbar b{color:var(--ink-2);font-weight:600}
.brandbar .ic{color:var(--faint);font-size:11px}

/* ---------- reveal ---------- */
.rv{opacity:0;transform:translateY(10px)}
.rv.in{opacity:1;transform:none;transition:opacity .7s var(--ease),transform .7s var(--ease)}

/* ---------- step control ---------- */
#steps{margin-top:14px;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 9px;box-shadow:0 1px 2px rgba(21,24,50,.05);flex:none}
#steps.hide{display:none}
#steps button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 8px;border-radius:7px;min-width:72px}
#steps button:hover{background:var(--ground)}
#steps button.on{background:var(--navy)}

<body>

</div>

<script>
(function(){
"use strict";

var PROMPT1 = "I need an omnidirectional antenna for a drone, with as few nulls as possible.";
var PROMPT2 = "LTE and GNSS, connector is u.FL.";
var PROMPT3 = "No ground plane — small frame, limited surface.";
var TS = [
  "Sep 09, 2026, 9:21 AM (PDT)",
  "Sep 09, 2026, 9:27 AM (PDT)",
  "Sep 09, 2026, 9:33 AM (PDT)"
];

var STEP_LABELS = ["Landing","Initiation","Interpretation","Shortlist","Recommend","Reset"];
var LAST = 6;

var scroll = document.getElementById('scroll');
var intext = document.getElementById('intext');
var infield = document.getElementById('infield');
var send = document.getElementById('send');
var stepsBar = document.getElementById('steps');
var actbar = document.getElementById('actbar');

var timers = [];
function at(ms, fn){ timers.push(setTimeout(fn, ms)); }
function clearTimers(){ timers.forEach(clearTimeout); timers = []; }

/* ---------- citations ---------- */
var CITATIONS = [
  { num: 1, kind: 'RF design note', ref: 'Impedance',
    title: '50Ω Impedance — RF Design Note', tag: '§2 · Impedance matching',
    quote: 'Commercial RF and wireless systems — WLAN, cellular, GNSS — are near-universally designed around a 50Ω characteristic impedance. Match to this value unless the board explicitly specifies otherwise.' },
  { num: 2, kind: 'Datasheet', ref: 'ANT-521',
    title: 'ANT-521 — Spec sheet', tag: 'p. 4 · Radiation pattern',
    quote: 'Ground-plane-dependent element. Pattern and gain figures are measured on a 40 × 40 mm reference ground plane; performance degrades without one.' },
  { num: 3, kind: 'Datasheet', ref: 'ANT-518',
    title: 'ANT-518 — Spec sheet', tag: 'p. 3 · Mounting',
    quote: 'Balanced dipole element — no ground plane required. Pattern measured in free space and on a 20 × 20 mm coupon: 0.4 dB delta.' },
  { num: 4, kind: 'Datasheet', ref: 'ANT-533',
    title: 'ANT-533 — Spec sheet', tag: 'p. 5 · Connector',
    quote: 'u.FL-compatible via a SMA-to-u.FL adapter (sold separately). Adapter adds one mated connection to the RF path.' }
];
function citeFooter(activeNum){
  return CITATIONS.map(function(c){
    return '<span class="cpill' + (c.num === activeNum ? ' active' : '') + '">&#187;' + c.num + ' &middot; ' + c.kind + ' &middot; ' + c.ref + '</span>';
  }).join('');
}
function citePop(num){
  var c = CITATIONS[num - 1];
  return '<span class="cpop">' +
    '<span class="cpop-src"><span class="globe">&#127760;</span>rapidflare.ai<span class="ext">&#8599;</span></span>' +
    '<span class="cpop-title">' + c.title + '</span>' +
    '<span class="cpop-tag">' + c.tag + '</span>' +
    '<span class="cpop-quote">&ldquo;' + c.quote + '&rdquo;</span>' +
    '<span class="cpop-foot">' + citeFooter(num) + '</span>' +
  '</span>';
}
function cite(num){
  var c = CITATIONS[num - 1];
  return '<span class="ctag" tabindex="0"><span class="ctag-ar">&#187;</span>' + num + ' &middot; ' + c.kind + ' &middot; ' + c.ref + citePop(num) + '</span>';
}
function citeBadge(num){
  return '<span class="cbadge" tabindex="0">' + num + citePop(num) + '</span>';
}

/* ---------- message meta row ---------- */
function metaRow(ts){
  return '<div class="mrow"><div class="av">&#10022;</div>' +
    '<div class="macts">' +
      '<button title="Reasoning">&#10038;</button>' +
      '<button title="Helpful">&#9651;</button>' +
      '<button title="Not helpful">&#9661;</button>' +
      '<button title="Read aloud">&#9654;</button>' +
      '<button title="Copy">&#10697;</button>' +
    '</div>' +
    '<div class="mts">' + ts + '</div></div>';
}

/* ---------- content blocks ---------- */
function landing(){
  return '<div class="lwrap">' +
    '<div class="lmark">&#10022;</div>' +
    '<h1 class="lhead">Hi Sam, what can I help you with today?</h1>' +
    '<div class="lpills">' +
      '<button class="lpill">I need an omnidirectional antenna for a drone, with as few nulls as possible.</button>' +
      '<button class="lpill">Buck converter for a 12&nbsp;V rail, 3&nbsp;A continuous, fanless enclosure.</button>' +
      '<button class="lpill">Low-power BLE module for a battery sensor that ships to the EU.</button>' +
      '<button class="lpill">Isolated CAN transceiver for an industrial motor drive.</button>' +
    '</div>' +
  '</div>';
}

function userTurn(text, st, id){
  return '<div class="turn user"' + (st ? ' data-st="' + st + '"' : '') + (id ? ' id="' + id + '"' : '') + '><div class="av">&#9679;</div>' +
    '<div class="ubub">' + text + '</div></div>';
}

/* ---------- turn 1: the transcript paragraphs, plain, in full ---------- */
var THINK_VERBS = ['Reading the request', 'Weighing antenna types', 'Checking impedance'];
function thinkingRow(){
  return '<div class="think" id="think"><span class="think-ico">&#10022;</span><span class="think-verb" id="thinkVerb">' + THINK_VERBS[0] + '</span></div>';
}
function runThinking(done){
  var el = document.getElementById('thinkVerb');
  if(!el){ if(done) done(); return; }
  var i = 0;
  function step(){
    i++;
    if(i >= THINK_VERBS.length){ at(380, done); return; }
    el.classList.add('out');
    at(180, function(){
      el.textContent = THINK_VERBS[i];
      el.classList.remove('out');
      at(430, step);
    });
  }
  at(430, step);
}
function question1(n){
  return '<p class="aline' + (n === 3 ? ' rv' : '') + '"' + (n === 3 ? ' id="q1"' : '') + '>Could you let me know what frequency bands this needs to support, and what connector type your board uses?</p>';
}

/* ---------- reasoning block (turn 1 only, collapsed by default) ---------- */
function reasoningBlock(n){
  return '<div' + (n === 3 ? ' class="rv" id="rwrap"' : '') + '>' +
    '<button class="rtog closed"><span class="bulb">&#9678;</span><span class="rlabel">Show reasoning</span><span class="car">&#9662;</span></button>' +
    '<div class="rbody" id="rbody">' +
      '<p>This reads like a use-case question — the buyer is describing a deployment (a drone airframe) rather than naming a part or a spec.</p>' +
      '<p>Three explicit constraints: omnidirectional coverage, minimal nulls, drone mounting. <b>Dipole and monopole-style</b> elements satisfy the first two best, since they hold a fuller 360&deg; pattern with fewer dead zones than directional designs — that&rsquo;s how the pattern requirement gets met, not a filter of its own.</p>' +
      '<p>Translating those into catalog filters: fix radiation pattern to omnidirectional, low-null, and set impedance to <b>50&nbsp;&Omega;</b> as a starting point — near-universal across RF and wireless, so it costs almost nothing and rules out a handful of non-standard parts.</p>' +
      '<p>Running those filters across 24 antennas returns 20 candidates. Still too broad to recommend confidently — <b>bands</b> and <b>connector type</b> are the next two most selective parameters, and I have neither.</p>' +
      '<p>Ranking by fit doesn&rsquo;t separate the 20 meaningfully at this stage, which confirms a clarifying question will do more here than more ranking.</p>' +
    '</div></div>';
}

/* ---------- filters card (cumulative recap, one per turn) ---------- */
var FILTERS = [
  { id:'pattern', turn:1, state:'stated', label:'Radiation pattern',
    value:'Omnidirectional, low-null',
    options:['Omnidirectional, low-null','Omnidirectional','Directional','Any'],
    reason:'You asked for omnidirectional coverage with minimal dead zones.' },
  { id:'impedance', turn:1, state:'assumed', label:'Impedance',
    value:'50 Ω',
    options:['50 Ω','75 Ω','Any'],
    reason:'Standard across RF and wireless systems — rules out non-standard components.' },
  { id:'bands', turn:2, state:'stated', label:'Frequency bands',
    value:'LTE, GNSS',
    options:['LTE, GNSS','LTE only','GNSS only','LTE, GNSS, Wi-Fi','Any'],
    reason:'You specified LTE and GNSS support.' },
  { id:'connector', turn:2, state:'stated', label:'Connector',
    value:'u.FL',
    options:['u.FL','u.FL (adapter OK)','SMA','MMCX','Any'],
    reason:'You specified a u.FL connector.' },
  { id:'groundplane', turn:3, state:'stated', label:'Ground plane',
    value:'Not available',
    options:['Not available','Available','Unknown'],
    reason:'You confirmed no ground plane at the mount point.' }
];
var FILTER_CAP = 3;
/* Which rows show by default when a card has more than FILTER_CAP: prioritize
   whatever is newest — first the filters that became known this turn, then
   fill remaining slots by recency (most-recently-known first) — so a fresh
   row is (almost) never buried behind "+N more". Ties within the same turn
   keep their natural (insertion) order. Everything else renders in its usual
   chronological position but starts collapsed under the toggle. */
function visibleFilterIds(rows){
  if(rows.length <= FILTER_CAP) return null;
  var byRecency = rows.slice().sort(function(a, b){ return b.turn - a.turn; });
  var ids = {};
  byRecency.slice(0, FILTER_CAP).forEach(function(f){ ids[f.id] = true; });
  return ids;
}
function filterRow(f, turn, isNew, isExtra){
  var opts = f.options.map(function(o){
    return '<option' + (o === f.value ? ' selected' : '') + '>' + o + '</option>';
  }).join('');
  return '<div class="frow ' + f.state + (isNew ? ' rv' : '') + (isExtra ? ' frow-extra' : '') + '" id="frow-' + turn + '-' + f.id + '">' +
    '<div class="frow-top"><span class="flabel">' + f.label + '</span>' +
      (f.state === 'assumed' ? '<span class="fstate">Assumed</span>' : '') +
      '<button class="fx" title="Remove filter">&#215;</button></div>' +
    '<label class="fselwrap"><select class="fsel">' + opts + '</select><span class="fcar">&#8250;</span></label>' +
    '<p class="freason"><b>Reason:</b> ' + f.reason + '</p>' +
  '</div>';
}
function filtersCard(turn, n){
  var current = (turn === 1 && n === 3) || (turn === 2 && n === 4) || (turn === 3 && n === 5);
  var all = FILTERS.filter(function(f){ return f.turn <= turn; });
  var visibleIds = visibleFilterIds(all);
  var hiddenCount = 0;
  var rows = all.map(function(f){
    var isExtra = visibleIds ? !visibleIds[f.id] : false;
    if(isExtra) hiddenCount++;
    return filterRow(f, turn, current && f.turn === turn, isExtra);
  }).join('');
  var more = hiddenCount > 0
    ? '<button class="fmore" data-n="' + hiddenCount + '"><span class="fmore-ic">&#9662;</span><span class="fmore-label">+' + hiddenCount + ' more</span></button>'
    : '';
  return '<div class="fcard' + (current ? ' rv' : '') + '" id="fcard-' + turn + '">' +
    '<div class="fcard-h"><span class="fic">&#9776;</span>Filters:</div>' +
    rows +
    more +
    '<button class="fapply"><span>&#9663;</span>Apply</button>' +
  '</div>';
}

/* ---------- turn 2: shortlist ---------- */
var CANDIDATES = [
  {id:'ANT-521', bands:'LTE, GNSS', conn:'u.FL', gp:'Required', gpOk:false,
   desc:'Omnidirectional dipole &middot; ground-plane dependent',
   note:'strong omnidirectional performance and low null count, but relies on a ground plane at the mount point for rated performance.'},
  {id:'ANT-518', bands:'LTE, GNSS', conn:'u.FL', gp:'Not required', gpOk:true,
   desc:'Omnidirectional dipole &middot; ground-plane free',
   note:'slightly wider beamwidth than ANT-521, but performs reliably without a ground plane.'},
  {id:'ANT-533', bands:'LTE, GNSS', conn:'u.FL (adapter)', gp:'Required', gpOk:false,
   desc:'Omnidirectional dipole &middot; u.FL via adapter',
   note:'comparable to ANT-521, though it needs a connector adapter for u.FL compatibility, which adds a point of failure.'}
];

function productStrip(){
  return '<div class="pstrip"><div class="ph">Products</div><div class="pcards">' +
    CANDIDATES.map(function(c){
      return '<div class="pcard"><span class="pid">' + c.id + citeBadge(CITE_BY_ID[c.id]) + '</span><span class="pdesc">' + c.desc + '</span><span class="pgo">&#8250;</span></div>';
    }).join('') +
  '</div></div>';
}

function comparisonTable(){
  return '<div class="ctable-wrap"><table class="ctable"><thead><tr>' +
    '<th>Model</th><th>Bands</th><th>Connector</th><th>Ground Plane</th>' +
  '</tr></thead><tbody>' +
    CANDIDATES.map(function(c){
      return '<tr><td class="modelname">' + c.id + '</td><td>' + c.bands + '</td><td>' + c.conn + '</td><td>' + c.gp + '</td></tr>';
    }).join('') +
  '</tbody></table></div>';
}

function candidateNotes(){
  return '<div class="cnotes">' +
    CANDIDATES.map(function(c){
      return '<p class="cnote"><b>' + c.id + '</b> &mdash; ' + c.note + '</p>';
    }).join('') +
  '</div>';
}

function question2(n){
  return '<p class="aline"' + (n === 4 ? ' data-st="4" id="q2"' : '') + '>I don&rsquo;t have your ground plane availability yet, which is the deciding factor between these three — is a ground plane available at the mount point, or is this a ground-plane-free setup?</p>';
}

/* ---------- turn 3: recommendation ---------- */
function reqRow(label, val, ok){
  return '<div class="req' + (ok ? '' : ' miss') + '">' +
    '<span class="vd ' + (ok ? 'yes' : 'no') + '">' + (ok ? '&#10003;' : '&#10007;') + '</span>' +
    '<span><span class="rn">' + label + '</span><span class="rv2">' + val + '</span></span></div>';
}

var CITE_BY_ID = { 'ANT-521': 2, 'ANT-518': 3, 'ANT-533': 4 };
function recCard(c, winner){
  var win = c.id === winner;
  return '<div class="rec' + (win ? ' win' : ' out') + '">' +
    '<div class="rh"><div><div class="pn">' + c.id + citeBadge(CITE_BY_ID[c.id]) + '</div><div class="sub">' + c.desc + '</div></div>' +
    (win ? '<span class="badge">Recommended</span>' : '<span class="badge alt">Not chosen</span>') + '</div>' +
    '<div class="reqs">' +
      reqRow('Bands', c.bands, true) +
      reqRow('Connector', c.conn, true) +
      reqRow('Ground plane', c.gp, c.gpOk) +
    '</div>' +
    '<div class="rfoot"><p>' + c.note.charAt(0).toUpperCase() + c.note.slice(1) + '</p></div>' +
  '</div>';
}

function recommendation(){
  return '<div class="recs" id="recs">' + CANDIDATES.map(function(c){ return recCard(c, 'ANT-518'); }).join('') + '</div>';
}

/* ---------- render ---------- */
function render(n){
  clearTimers();
  userScrolled = false;
  intext.className = 'intext ph';
  intext.textContent = 'Ask a follow-up question…';
  infield.classList.remove('hot');
  send.className = 'send';
  actbar.hidden = n < 3;

  if(n === 1 || n === LAST){
    scroll.innerHTML = landing();
  } else {
    scroll.innerHTML = buildFull(n);
  }

  Array.prototype.forEach.call(scroll.querySelectorAll('[data-st="' + n + '"]'), function(el){ el.classList.add('rv'); });

  paintSteps(n);
  void scroll.offsetHeight;
  (ANIM[n] || function(){})();
}

function buildFull(n){
  var h = '<div class="eyebrow">New conversation</div>';
  h += userTurn(PROMPT1, n === 2 ? 2 : 0);

  if(n >= 3){
    h += '<div class="turn aturn" id="turn1">';
    h += metaRow(TS[0]);
    h += '<div class="agent" id="agent1">';
    if(n === 3) h += thinkingRow();
    h += reasoningBlock(n);
    h += filtersCard(1, n);
    h += '<p class="aline' + (n === 3 ? ' rv' : '') + '"' + (n === 3 ? ' id="p1"' : '') + '>For an omnidirectional antenna with minimal nulls, the best-performing designs are typically <b>dipole or monopole-style</b>, since they maintain a fuller 360&deg; radiation pattern with fewer dead zones than directional antennas.</p>';
    h += '<p class="aline' + (n === 3 ? ' rv' : '') + '"' + (n === 3 ? ' id="p2"' : '') + '>I&rsquo;m also assuming standard <b>50-ohm impedance</b> for this recommendation, since that&rsquo;s the near-universal standard across RF and wireless systems — this rules out a small number of non-standard components. ' + cite(1) + '</p>';
    h += '<p class="aline' + (n === 3 ? ' rv' : '') + '"' + (n === 3 ? ' id="p3"' : '') + '>Based on these considerations, the candidate pool narrows from 24 to 20 — still too broad a range for me to recommend specific models with confidence. The remaining spread depends heavily on your frequency bands and connector type, both of which significantly affect which antennas are viable for your setup.</p>';
    h += question1(n);
    h += '</div></div>';
  }

  if(n >= 4){
    h += userTurn(PROMPT2, n === 4 ? 4 : 0, 'ut2');
    h += '<div class="turn aturn" id="turn2">';
    h += metaRow(TS[1]);
    h += '<div class="agent">';
    h += filtersCard(2, n);
    h += '<p class="aline"' + (n === 4 ? ' data-st="4" data-k="lead2"' : '') + '>Based on your requirements — an omnidirectional antenna with minimal nulls, supporting LTE and GNSS bands, with a u.FL connector — the candidate pool narrows significantly, from 20 down to 5.</p>';
    h += '<p class="aline"' + (n === 4 ? ' data-st="4" data-k="why2"' : '') + '>Here&rsquo;s how I arrived at this shortlist: bands and connector type are the two most selective filters in this category, since many antennas only support one band family, and connector mismatches typically require an adapter that reduces reliability.</p>';
    h += '<div' + (n === 4 ? ' data-st="4" data-k="strip"' : '') + '>' + productStrip() + '</div>';
    h += '<div' + (n === 4 ? ' data-st="4" data-k="table"' : '') + '>' + comparisonTable() + '</div>';
    h += '<div' + (n === 4 ? ' data-st="4" data-k="notes"' : '') + '>' + candidateNotes() + '</div>';
    h += question2(n);
    h += '</div></div>';
  }

  if(n >= 5){
    h += userTurn(PROMPT3, n === 5 ? 5 : 0, 'ut3');
    h += '<div class="turn aturn" id="turn3">';
    h += metaRow(TS[2]);
    h += '<div class="agent">';
    h += filtersCard(3, n);
    h += '<p class="aline"' + (n === 5 ? ' data-st="5" data-k="lead3"' : '') + '>Based on your ground-plane-free mounting constraint, <b>ANT-518</b> is the recommended choice: it maintains reliable omnidirectional performance without a ground plane, unlike ANT-521 and ANT-533, both of which depend on one for their rated performance.</p>';
    h += '<div' + (n === 5 ? ' data-st="5" data-k="recs"' : '') + '>' + recommendation() + '</div>';
    h += '<p class="aline"' + (n === 5 ? ' data-st="5" data-k="summary"' : '') + '><b>Summary:</b> ANT-518 is the best fit given your constraints. ' + cite(3) + ' ANT-521 would have been the top pick if a ground plane were available, but it isn&rsquo;t optimized for this setup. ' + cite(2) + ' ANT-533 remains viable only with the added connector adapter, which isn&rsquo;t ideal for a compact frame.</p>';
    h += '<p class="aline"' + (n === 5 ? ' data-st="5" data-k="close"' : '') + '>Let me know if you have any additional requirements — gain preference or a specific frequency sub-band — and I can refine this further.</p>';
    h += '</div></div>';
  }

  return h;
}

function show(el, cls){ if(el) el.classList.add(cls || 'in'); }
/* reveal a filters card, then stagger in the rows that are new this turn */
function revealCard(id){
  var card = document.getElementById(id);
  if(!card) return;
  show(card);
  Array.prototype.forEach.call(card.querySelectorAll('.frow.rv'), function(row, i){
    at(240 + i * 160, function(){
      row.classList.add('in');
      row.classList.add('flash');
      at(1100, function(){ row.classList.remove('flash'); });
    });
  });
}
var userScrolled = false;
scroll.addEventListener('wheel', function(){ userScrolled = true; }, { passive: true });
scroll.addEventListener('touchmove', function(){ userScrolled = true; }, { passive: true });

/* reasoning toggle + filter interactions (delegated — content is rebuilt each state) */
scroll.addEventListener('click', function(e){
  var tog = e.target.closest('.rtog');
  if(tog){
    var body = document.getElementById('rbody');
    if(!body) return;
    var open = body.classList.toggle('open');
    body.style.maxHeight = open ? body.scrollHeight + 'px' : '0px';
    tog.classList.toggle('closed', !open);
    tog.querySelector('.rlabel').textContent = open ? 'Hide reasoning' : 'Show reasoning';
    return;
  }
  var x = e.target.closest('.fx');
  if(x){
    var row = x.closest('.frow'), card = x.closest('.fcard');
    row.style.maxHeight = row.offsetHeight + 'px';
    void row.offsetHeight;
    row.classList.add('gone');
    if(card) card.classList.add('dirty');
    at(320, function(){ if(row.parentNode) row.parentNode.removeChild(row); });
    return;
  }
  var ap = e.target.closest('.fapply');
  if(ap){
    var c = ap.closest('.fcard');
    if(c) c.classList.remove('dirty');
    ap.classList.add('flash');
    at(650, function(){ ap.classList.remove('flash'); });
    return;
  }
  var more = e.target.closest('.fmore');
  if(more){
    var mcard = more.closest('.fcard');
    var expanded = mcard.classList.toggle('expanded');
    more.querySelector('.fmore-label').textContent = expanded ? 'Show less' : '+' + more.dataset.n + ' more';
  }
});
scroll.addEventListener('change', function(e){
  var sel = e.target.closest('.fsel');
  if(sel){
    var card = sel.closest('.fcard');
    if(card) card.classList.add('dirty');
  }
});
function toBottom(force){ if(force || !userScrolled) scroll.scrollTo({ top: scroll.scrollHeight, behavior: 'smooth' }); }

/* typing */
function type(text, dur, done){
  var i = 0, per = dur / text.length;
  intext.className = 'intext';
  intext.textContent = '';
  infield.classList.add('hot');
  function step(){
    i++;
    intext.innerHTML = text.slice(0, i).replace(/</g,'&lt;') + '<span class="caret"></span>';
    if(i < text.length){ at(per, step); }
    else { send.classList.add('on'); at(260, function(){ if(done) done(); }); }
  }
  at(120, step);
}
function fire(done){
  send.classList.add('fire');
  at(180, function(){
    send.className = 'send';
    infield.classList.remove('hot');
    intext.className = 'intext ph';
    intext.textContent = 'Ask a follow-up question…';
    if(done) done();
  });
}

/* ---------- per-state animations ---------- */
var ANIM = {

  1: function(){},

    if(t){ t.style.opacity = 0; }

  3: function(){
    runThinking(function(){

      at(240, function(){

        show(document.getElementById('rwrap'));

  4: function(){

    type(PROMPT2, 900, function(){
      fire(function(){
        if(ut2){ ut2.style.opacity = ''; ut2.classList.add('in'); }
        at(280, function(){ show(turn2); toBottom(); });
        at(560, function(){ revealCard('fcard-2'); toBottom(); });
        at(1250, function(){ show(scroll.querySelector('[data-k="lead2"]')); toBottom(); });
        at(1700, function(){ show(scroll.querySelector('[data-k="why2"]')); toBottom(); });
        at(2200, function(){ show(scroll.querySelector('[data-k="strip"]')); toBottom(); });
        at(2700, function(){ show(scroll.querySelector('[data-k="table"]')); toBottom(); });
        at(3200, function(){ show(scroll.querySelector('[data-k="notes"]')); toBottom(); });
        at(3750, function(){ show(document.getElementById('q2')); toBottom(); });
      });
    });
  },

  5: function(){
    var ut3 = document.getElementById('ut3');
    var turn3 = document.getElementById('turn3');
    if(ut3) ut3.style.opacity = 0;
    if(turn3) turn3.classList.add('rv');
    type(PROMPT3, 900, function(){
      fire(function(){
        if(ut3){ ut3.style.opacity = ''; ut3.classList.add('in'); }
        at(280, function(){ show(turn3); toBottom(); });
        at(560, function(){ revealCard('fcard-3'); toBottom(); });
        at(1250, function(){ show(scroll.querySelector('[data-k="lead3"]')); toBottom(); });
        at(1650, function(){
          show(scroll.querySelector('[data-k="recs"]'));
          var cards = scroll.querySelectorAll('.rec');
          Array.prototype.forEach.call(cards, function(c, i){
            c.classList.add('rv');
            at(i * 200, function(){ c.classList.add('in'); });
          });
          toBottom();
        });
        at(2500, function(){ show(scroll.querySelector('[data-k="summary"]')); toBottom(); });
        at(2950, function(){ show(scroll.querySelector('[data-k="close"]')); toBottom(); });
      });
    });
  },

  6: function(){
    var mark = scroll.querySelector('.lmark'), head = scroll.querySelector('.lhead'), pills = scroll.querySelector('.lpills');
    [mark, head, pills].forEach(function(el, i){
      if(!el) return;
      el.classList.add('rv');
      at(150 + i * 160, function(){ el.classList.add('in'); });
    });
  }
};

/* ---------- step control ---------- */
var current = 1;
function paintSteps(n){
  Array.prototype.forEach.call(stepsBar.children, function(b){
    if(b.dataset.n) b.classList.toggle('on', +b.dataset.n === n);
  });
}
function buildSteps(){
  var h = '';
  for(var i = 1; i <= LAST; i++){
    h += '<button data-n="' + i + '"><span class="num">' + i + '</span><span class="lab">' + STEP_LABELS[i-1] + '</span></button>';
  }
  h += '<span class="hint">H hide bar<br>&#8592; &#8594; step &#183; R replay</span>';
  stepsBar.innerHTML = h;
  stepsBar.addEventListener('click', function(e){
    var b = e.target.closest('button[data-n]');
    if(b) go(+b.dataset.n);
  });
}
function go(n){ current = n; render(n); }

document.addEventListener('keydown', function(e){
  var k = e.key.toLowerCase();
  if(k === 'h'){ stepsBar.classList.toggle('hide'); fit(); return; }
  if(k === 'r'){ go(current); return; }
  if(e.key === 'ArrowRight' || e.key === ' '){ e.preventDefault(); go(Math.min(LAST, current + 1)); return; }
  if(e.key === 'ArrowLeft'){ e.preventDefault(); go(Math.max(1, current - 1)); return; }
  if(k >= '1' && k <= String(LAST)){ go(+k); }
});

/* ---------- fit ---------- */
var scaler = document.getElementById('scaler');
function fit(){
  var barH = stepsBar.classList.contains('hide') ? 0 : stepsBar.offsetHeight + 14;
  var s = Math.min((window.innerWidth - 32) / 1280, (window.innerHeight - 32 - barH) / 720);
  scaler.style.transform = 'scale(' + s + ')';
  scaler.style.height = (720 * s) + 'px';
}
window.addEventListener('resize', fit);

/* ---------- help menu ---------- */
var helpbtn = document.getElementById('helpbtn');
var helpmenu = document.getElementById('helpmenu');
helpbtn.addEventListener('click', function(e){
  e.stopPropagation();
  helpmenu.classList.toggle('open');
});
document.addEventListener('click', function(e){
  if(helpmenu.classList.contains('open') && !helpmenu.contains(e.target)){ helpmenu.classList.remove('open'); }
});

buildSteps();
fit();
go(1);
})();
</script>
